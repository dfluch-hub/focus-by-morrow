<!doctype html>
<html lang="de" data-theme="mint">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090b">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="FOCUS / by Morrow — private focus, brain dump and regulation for ADHD/AuDHD adults.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FOCUS">
  <link rel="manifest" href="./manifest.json?v=2.0.0">
  <title>FOCUS / by Morrow</title>
  <style>
    :root{--bg:#08090b;--panel:rgba(255,255,255,.035);--panel2:rgba(255,255,255,.06);--text:#f7f8fb;--muted:#b9c0cb;--soft:#8f97a5;--line:rgba(255,255,255,.1);--accent:#9ef4c8;--accent-rgb:158,244,200;--ink:#06110b;--danger:#ff9aa7;--nav:72px;--top:54px}
    html[data-theme="violet"]{--accent:#c8b7ff;--accent-rgb:200,183,255;--ink:#0c0816}html[data-theme="ember"]{--accent:#ffc794;--accent-rgb:255,199,148;--ink:#160b03}
    *{box-sizing:border-box}html,body{width:100%;height:100%;height:100dvh;max-height:100dvh;margin:0;overflow:hidden;background:var(--bg);color:var(--text)}html{overscroll-behavior:none}
    body{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;background:radial-gradient(700px 520px at 88% -12%,rgba(var(--accent-rgb),.11),transparent 60%),var(--bg)}
    button,input{font:inherit}button{border:0;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}button:active{transform:scale(.98)}button:focus-visible,input:focus-visible{outline:2px solid rgba(var(--accent-rgb),.85);outline-offset:2px}input{color:var(--text)}input::placeholder{color:var(--soft)}
    .app{width:min(100%,760px);height:100dvh;margin:auto;display:flex;flex-direction:column;overflow:hidden;padding:env(safe-area-inset-top) 12px calc(var(--nav) + env(safe-area-inset-bottom) + 10px)}
    .topbar{height:var(--top);flex:0 0 var(--top);display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{display:flex;align-items:center;gap:9px;font-weight:900;letter-spacing:-.03em}.brand-mark{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:rgba(var(--accent-rgb),.09);border:1px solid rgba(var(--accent-rgb),.22);color:var(--accent)}
    .top-actions{display:flex;align-items:center;gap:7px}.spark{height:42px;min-width:58px;padding:0 10px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:5px;background:rgba(var(--accent-rgb),.07);border:1px solid rgba(var(--accent-rgb),.18);color:var(--accent);font-size:13px;font-weight:900}.icon-btn{width:48px;height:48px;min-width:48px;border-radius:14px;background:rgba(255,255,255,.04);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:19px}
    .screen{display:none;flex:1;min-height:0;overflow:hidden}.screen.active{display:flex;flex-direction:column}.glass{background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.025));border:1px solid var(--line);border-radius:26px;box-shadow:0 22px 65px rgba(0,0,0,.3);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .primary,.ghost,.subtle,.danger,.pill,.theme-btn,.lang-btn,.reset-card{min-height:48px;border-radius:14px;font-weight:820;padding:0 14px}.primary{background:var(--accent);color:var(--ink)}.ghost{background:rgba(255,255,255,.035);border:1px solid var(--line);color:var(--muted)}.subtle{background:rgba(255,255,255,.06);border:1px solid var(--line)}.danger{background:rgba(255,105,120,.08);border:1px solid rgba(255,105,120,.18);color:#ffc3ca}
    .focus-stage{flex:1;min-height:0;display:flex}.focus-card{width:100%;height:100%;min-height:0;display:flex;flex-direction:column;padding:14px;overflow:hidden}.focus-empty{flex:1;display:grid;place-items:center}.focus-empty-actions{width:min(100%,410px);display:grid;gap:9px}
    .active-task{height:100%;min-height:0;display:flex;flex-direction:column}.active-title{margin:3px 0 8px;text-align:center;font-size:clamp(23px,7vw,32px);line-height:1.08;letter-spacing:-.045em;font-weight:900;max-height:2.25em;overflow:hidden}.micro-inline{display:grid;gap:6px;margin-bottom:7px}.micro{min-height:50px;display:grid;grid-template-columns:32px 1fr;align-items:center;gap:9px;padding:8px 10px;border:1px solid var(--line);border-radius:15px;background:rgba(255,255,255,.03)}.micro b{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:var(--accent);background:rgba(var(--accent-rgb),.08);font-size:12px}.micro span{font-size:12px;line-height:1.35}
    .timer-zone{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px}.orbit{--p:0deg;width:min(42vw,210px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;position:relative;background:conic-gradient(var(--accent) var(--p),rgba(255,255,255,.07) 0);box-shadow:0 0 60px rgba(var(--accent-rgb),.09)}.orbit:before{content:"";position:absolute;inset:11px;border-radius:50%;background:radial-gradient(circle at 42% 30%,rgba(255,255,255,.055),#0b0c0f 62%);border:1px solid rgba(255,255,255,.07)}.orbit-time{position:relative;z-index:2;font-size:clamp(34px,10vw,52px);font-weight:900;letter-spacing:-.06em;font-variant-numeric:tabular-nums}
    .duration{width:min(100%,360px);display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.pill{padding:0;background:rgba(255,255,255,.035);border:1px solid var(--line);color:var(--muted);font-size:12px}.pill.active{background:rgba(var(--accent-rgb),.1);border-color:rgba(var(--accent-rgb),.28);color:var(--text)}.timer-buttons{width:min(100%,360px);display:grid;grid-template-columns:1.3fr .7fr;gap:7px}.focus-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding-top:7px}.focus-actions .breakdown{grid-column:1/-1}.expired{flex:1;display:grid;align-content:center;gap:9px;width:min(100%,410px);margin:auto}
    .collect{gap:8px}.capture-wrap{flex:0 0 auto;display:grid;gap:6px}.capture{display:grid;grid-template-columns:minmax(0,1fr) 48px;gap:6px;padding:5px;border-radius:17px;background:var(--panel);border:1px solid var(--line)}.capture input{height:48px;min-width:0;border:0;outline:0;background:transparent;padding:0 12px}.send{width:48px;height:48px;border-radius:13px;background:var(--accent);color:var(--ink);font-size:22px;font-weight:900}.capture-options{display:flex;gap:6px}.capture-options .pill{min-width:60px}
    .list-head{height:38px;flex:0 0 38px;display:flex;align-items:center;justify-content:space-between}.list-head strong{font-size:13px}.text-btn{min-height:48px;padding:0 8px;background:transparent;color:var(--muted);font-size:11px;font-weight:800}.task-list{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;display:grid;align-content:start;gap:7px}.task-list::-webkit-scrollbar{display:none}.task-row{display:grid;grid-template-columns:minmax(0,1fr) 48px 48px;align-items:center;min-height:68px;border:1px solid var(--line);border-radius:17px;background:var(--panel);overflow:hidden}.task-main{min-width:0;min-height:64px;padding:9px 10px;text-align:left;background:transparent}.task-main strong{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:flex;gap:5px;margin-top:6px}.badge{font-size:10px;color:var(--muted);padding:3px 6px;border:1px solid var(--line);border-radius:999px}.row-btn{width:48px;height:48px;background:transparent;color:var(--muted);font-size:18px}.list-empty{padding:28px 12px;text-align:center;color:var(--soft);font-size:12px}
    .reset-grid{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:8px}.reset-card{height:100%;padding:13px;text-align:left;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;justify-content:space-between}.reset-card strong{font-size:15px}.reset-card span{font-size:11px;color:var(--muted)}.reset-session{flex:1;min-height:0;display:flex}.reset-panel{width:100%;height:100%;padding:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center}.reset-timer{font-size:clamp(42px,14vw,70px);font-weight:900;letter-spacing:-.06em;font-variant-numeric:tabular-nums}.breath-circle{width:min(52vw,230px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(var(--accent-rgb),.2),rgba(var(--accent-rgb),.05));border:1px solid rgba(var(--accent-rgb),.28);box-shadow:0 0 70px rgba(var(--accent-rgb),.12);transform:scale(.78);transition:transform 1s linear}.breath-circle.inhale,.breath-circle.hold{transform:scale(1)}.breath-circle.exhale{transform:scale(.72)}.reset-label{font-size:18px;font-weight:850}.move-text{font-size:clamp(22px,7vw,34px);font-weight:900;line-height:1.1;max-width:520px}.reset-actions{width:min(100%,360px);display:grid;grid-template-columns:1fr 1fr;gap:7px}
    .bottom-nav{position:fixed;z-index:50;left:50%;bottom:calc(8px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(720px,calc(100% - 20px));height:var(--nav);padding:6px;display:grid;grid-template-columns:repeat(3,1fr);gap:5px;border-radius:20px;background:rgba(13,14,18,.92);border:1px solid var(--line);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 18px 55px rgba(0,0,0,.42)}.nav{min-height:48px;border-radius:14px;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px;font-size:10px;font-weight:900;letter-spacing:.04em}.nav.active{background:rgba(255,255,255,.07);color:var(--text)}.nav i{font-style:normal;font-size:17px}
    .modal{position:fixed;z-index:100;inset:0;display:none;background:rgba(0,0,0,.68);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom))}.modal.open{display:flex;align-items:center;justify-content:center}.settings{width:min(560px,100%);max-height:100%;overflow:auto;padding:16px;background:#0d0f13;border:1px solid var(--line);border-radius:24px;box-shadow:0 30px 90px rgba(0,0,0,.55)}.modal-head{display:flex;align-items:center;justify-content:space-between}.modal-head h2{font-size:18px;margin:0}.setting-row{min-height:62px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}.setting-row:last-child{border-bottom:0}.setting-row strong{font-size:13px}.lang-group,.theme-group{display:flex;gap:5px}.lang-btn,.theme-btn{min-width:58px;padding:0 10px;background:rgba(255,255,255,.035);border:1px solid var(--line);color:var(--muted);font-size:11px}.lang-btn.active,.theme-btn.active{background:rgba(var(--accent-rgb),.1);border-color:rgba(var(--accent-rgb),.25);color:var(--text)}.stat-line{font-size:12px;color:var(--muted)}.settings-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
    .toast{position:fixed;z-index:300;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translate(-50%,-14px);opacity:0;pointer-events:none;max-width:calc(100% - 28px);padding:11px 14px;border-radius:13px;background:rgba(20,22,27,.96);border:1px solid var(--line);font-size:12px;transition:.22s}.toast.show{opacity:1;transform:translate(-50%,0)}.fx{position:fixed;z-index:250;inset:0;pointer-events:none;overflow:hidden}.confetti{position:absolute;left:50%;top:48%;width:7px;height:13px;border-radius:999px;background:var(--accent);animation:burst .75s cubic-bezier(.2,.8,.2,1) forwards}@keyframes burst{to{opacity:0;transform:translate(var(--x),var(--y)) rotate(var(--r))}}
    @media(max-height:700px){.orbit{width:min(36vw,170px)}.active-title{font-size:clamp(20px,6vw,27px)}.focus-card{padding:10px}.micro{min-height:46px}.reset-panel{padding:10px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.001ms!important;transition-duration:.001ms!important}}
  </style>
</head>
<body>
<div id="toast" class="toast" role="status" aria-live="polite"></div><div id="fx" class="fx" aria-hidden="true"></div>
<main class="app">
  <header class="topbar"><div class="brand"><div class="brand-mark" aria-hidden="true">F</div><span>FOCUS</span></div><div class="top-actions"><div class="spark">✦ <span id="sparkCount">0</span></div><button id="settingsBtn" class="icon-btn" type="button" data-i18n-aria="aria.settings">⚙️</button></div></header>
  <section id="screenFocus" class="screen active" data-screen="focus"><div id="focusStage" class="focus-stage"></div></section>
  <section id="screenCollect" class="screen collect" data-screen="collect">
    <div class="capture-wrap"><form id="captureForm" class="capture" autocomplete="off"><input id="captureInput" type="text" maxlength="160" data-i18n-placeholder="collect.placeholder" data-i18n-aria="aria.capture"><button class="send" type="submit" data-i18n-aria="aria.add">+</button></form>
      <div id="captureDuration" class="capture-options" role="group" data-i18n-aria="aria.duration"><button type="button" class="pill" data-capture-minutes="5">5m</button><button type="button" class="pill active" data-capture-minutes="15">15m</button><button type="button" class="pill" data-capture-minutes="30">30m</button></div>
    </div>
    <div class="list-head"><strong data-i18n="collect.openLoops"></strong><button id="clearDoneBtn" class="text-btn" type="button" data-i18n="collect.clearDone"></button></div><div id="taskList" class="task-list"></div>
  </section>
  <section id="screenReset" class="screen" data-screen="reset"><div id="resetRoot" class="reset-grid"></div></section>
</main>
<nav class="bottom-nav" data-i18n-aria="aria.navigation"><button class="nav active" type="button" data-nav="focus"><i>◉</i><span data-i18n="nav.focus"></span></button><button class="nav" type="button" data-nav="collect"><i>＋</i><span data-i18n="nav.collect"></span></button><button class="nav" type="button" data-nav="reset"><i>↻</i><span data-i18n="nav.reset"></span></button></nav>
<div id="settingsModal" class="modal" role="dialog" aria-modal="true" data-i18n-aria="aria.settings"><div class="settings"><div class="modal-head"><h2 data-i18n="settings.title"></h2><button id="closeSettingsBtn" class="icon-btn" type="button" data-i18n-aria="aria.close">×</button></div>
<div class="setting-row"><strong data-i18n="settings.language"></strong><div class="lang-group"><button class="lang-btn" type="button" data-language="de">DE</button><button class="lang-btn" type="button" data-language="en">EN</button></div></div>
<div class="setting-row"><strong data-i18n="settings.theme"></strong><div class="theme-group"><button class="theme-btn" type="button" data-theme="mint" data-i18n="theme.mint"></button><button class="theme-btn" type="button" data-theme="violet" data-i18n="theme.violet"></button><button class="theme-btn" type="button" data-theme="ember" data-i18n="theme.ember"></button></div></div>
<div class="setting-row"><strong data-i18n="settings.sparks"></strong><span id="settingsSparks" class="stat-line"></span></div><div class="setting-row"><strong data-i18n="settings.focusTime"></strong><span id="settingsFocusTime" class="stat-line"></span></div>
<div class="settings-actions"><button id="exportBtn" class="ghost" type="button" data-i18n="settings.export"></button><button id="resetDataBtn" class="danger" type="button" data-i18n="settings.resetData"></button></div></div></div>
<script src="./app.js?v=2.0.0" defer></script>
</body></html>
