<!doctype html>
<html lang="en" data-theme="midnight">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#08090b">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="FOCUS by Morrow — a private, low-friction focus companion for ADHD and AuDHD adults.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FOCUS">
  <link rel="manifest" href="./manifest.json?v=1.7.0">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="stylesheet" href="./styles.css?v=1.7.0">
  <title>FOCUS / by Morrow</title>
</head>
<body>
  <div class="ambient" aria-hidden="true"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <main class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">F</div>
        <strong>FOCUS</strong>
      </div>
      <div class="top-actions">
        <div class="header-spark" aria-live="polite">✦ <span id="sparkCount">0</span></div>
        <button class="icon-btn" id="emergencyBtn" type="button" data-i18n-aria="aria.openEmergency" data-i18n-title="aria.emergencyMode">✦</button>
      </div>
    </header>

    <section id="screen-today" class="screen active" data-screen="today">
      <div class="today-layout">
        <form id="quickCaptureForm" class="quick-capture" autocomplete="off">
          <input id="quickTaskInput" type="text" maxlength="120" data-i18n-placeholder="today.placeholder" data-i18n-aria="aria.newTask">
          <button class="send-btn" type="submit" data-i18n-aria="aria.addTask" title="Add">↑</button>
        </form>
        <div id="taskGrid" class="task-grid" aria-live="polite"></div>
      </div>
    </section>

    <section id="screen-time" class="screen" data-screen="time">
      <div class="timer-only">
        <div id="timeOrbit" class="time-orbit" data-i18n-aria="aria.visualTimer">
          <div class="timer-inner">
            <div id="timerDigits" class="timer-digits">15:00</div>
          </div>
        </div>
        <div class="timer-controls">
          <div class="duration-row">
            <button class="chip" data-timer-minutes="5" type="button">5</button>
            <button class="chip active" data-timer-minutes="15" type="button">15</button>
            <button class="chip" data-timer-minutes="25" type="button">25</button>
            <button class="chip" data-timer-minutes="45" type="button">45</button>
          </div>
          <div class="timer-main-actions">
            <button id="timerToggleBtn" class="primary-btn" type="button"></button>
            <button id="timerResetBtn" class="ghost-btn" type="button" data-i18n="common.reset"></button>
          </div>
        </div>
      </div>
    </section>

    <section id="screen-menu" class="screen" data-screen="menu">
      <div class="menu-shell">
        <div class="segment-switch" role="tablist" data-i18n-aria="aria.menuMode">
          <button class="segment-btn active" type="button" data-menu-view="dice" data-i18n="menu.taskDice"></button>
          <button class="segment-btn" type="button" data-menu-view="dopamine" data-i18n="menu.dopamineTitle"></button>
        </div>

        <div id="menuPaneDice" class="menu-pane active">
          <article class="roulette-card">
            <div class="roulette-stage" id="rouletteStage">
              <div class="dice-core">
                <div class="dice-icon" aria-hidden="true">⌁</div>
                <h2 id="diceResult" class="dice-result"></h2>
              </div>
            </div>
            <div class="roulette-actions">
              <button id="rollBtn" class="primary-btn" type="button" data-i18n="menu.roll"></button>
              <button id="startRolledBtn" class="ghost-btn" type="button" disabled data-i18n="menu.startIt"></button>
            </div>
          </article>
        </div>

        <div id="menuPaneDopamine" class="menu-pane">
          <div id="dopamineItems" class="dopamine-items"></div>
        </div>
      </div>
    </section>

    <section id="screen-me" class="screen" data-screen="me">
      <div class="me-shell">
        <div class="stats-row">
          <div class="stat-card"><strong id="sessionCount">0</strong><span data-i18n="me.sessions"></span></div>
          <div class="stat-card"><strong id="focusMinutes">0 min</strong><span data-i18n="me.focusTime"></span></div>
          <div class="stat-card"><strong id="meSparkCount">0</strong><span data-i18n="common.sparks"></span></div>
        </div>

        <article class="settings-card">
          <div class="settings-title" data-i18n="me.preferences"></div>
          <div class="settings-row">
            <strong data-i18n="me.language"></strong>
            <div class="language-toggle" role="group" data-i18n-aria="aria.languageChoice">
              <button class="language-option" type="button" data-language="en">EN</button>
              <button class="language-option" type="button" data-language="de">DE</button>
            </div>
          </div>
          <div class="settings-row">
            <strong data-i18n="me.accent"></strong>
            <div class="theme-options" data-i18n-aria="aria.chooseTheme">
              <button class="theme-dot" type="button" data-theme-value="midnight" data-i18n-aria="aria.mintTheme"></button>
              <button class="theme-dot" type="button" data-theme-value="violet" data-i18n-aria="aria.violetTheme"></button>
              <button class="theme-dot" type="button" data-theme-value="ember" data-i18n-aria="aria.emberTheme"></button>
            </div>
          </div>
          <div class="settings-row">
            <strong data-i18n="me.dataHere"></strong>
            <button id="exportBtn" class="ghost-btn compact-btn" type="button" data-i18n="common.export"></button>
          </div>
          <div class="settings-row">
            <strong data-i18n="me.restore"></strong>
            <button id="importBtn" class="ghost-btn compact-btn" type="button" data-i18n="common.import"></button>
            <input id="importFile" type="file" accept="application/json" hidden>
          </div>
          <div class="settings-row">
            <strong data-i18n="me.resetData"></strong>
            <button id="resetDataBtn" class="danger-btn compact-btn" type="button" data-i18n="common.reset"></button>
          </div>
        </article>
      </div>
    </section>
  </main>

  <nav class="bottom-nav" data-i18n-aria="aria.mainNavigation">
    <button class="nav-btn active" data-nav="today" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12h16M12 4v16"/></svg><span data-i18n="nav.today"></span></button>
    <button class="nav-btn" data-nav="time" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg><span data-i18n="nav.time"></span></button>
    <button class="nav-btn" data-nav="menu" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M5 12h14M5 17h14"/></svg><span data-i18n="nav.menu"></span></button>
    <button class="nav-btn" data-nav="me" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3"/><path d="M5.5 19c1.4-3.2 3.6-4.8 6.5-4.8s5.1 1.6 6.5 4.8"/></svg><span data-i18n="nav.me"></span></button>
  </nav>

  <div id="emergencyBackdrop" class="emergency-backdrop" role="dialog" aria-modal="true" aria-labelledby="emergencyTitle">
    <div class="emergency-shell">
      <div class="emergency-top">
        <div class="emergency-brand" data-i18n="emergency.brand"></div>
        <button id="closeEmergencyBtn" class="icon-btn" type="button" data-i18n-aria="aria.closeEmergency">×</button>
      </div>
      <div class="emergency-center">
        <h2 id="emergencyTitle" class="emergency-title"></h2>
        <div id="microSteps" class="micro-steps"></div>
      </div>
      <div class="emergency-bottom">
        <button id="emergencyDoneBtn" class="primary-btn" type="button" data-i18n="emergency.enough"></button>
        <button id="emergencySwapBtn" class="ghost-btn" type="button" data-i18n="emergency.another"></button>
      </div>
    </div>
  </div>

  <script src="./app.js?v=1.7.0" defer></script>
</body>
</html>
