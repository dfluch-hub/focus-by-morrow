<!doctype html><html lang="en" data-theme="midnight"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08090b"><meta name="color-scheme" content="dark"><meta name="description" content="FOCUS by Morrow — a private, low-friction focus companion for ADHD and AuDHD adults."><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="FOCUS"><link rel="manifest" href="./manifest.json?v=1.5.0"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css?v=1.5.0"><title>FOCUS / by Morrow</title></head><body>
<div class="ambient" aria-hidden="true"></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<main class="app-shell">
<header class="topbar"><div class="brand"><div class="brand-mark">F</div><div class="brand-copy"><strong>FOCUS / by Morrow</strong><span data-i18n="brand.tagline"></span></div></div><div class="top-actions"><button class="icon-btn" id="emergencyBtn" data-i18n-aria="aria.openEmergency" data-i18n-title="aria.emergencyMode">✦</button><div class="spark-badge" aria-live="polite">✦ <span id="sparkCount">0</span></div></div></header>
<section id="screen-today" class="screen active" data-screen="today"><div class="today-layout"><article class="card capture-card"><form id="quickCaptureForm" class="capture-box" autocomplete="off"><input id="quickTaskInput" type="text" maxlength="120" data-i18n-placeholder="today.placeholder" data-i18n-aria="aria.newTask"><button class="primary-btn" type="submit" data-i18n="common.add"></button></form><div class="quick-meta" data-i18n-aria="aria.quickDefaults"><button class="chip active" type="button" data-duration="5">5m</button><button class="chip" type="button" data-duration="15">15m</button><button class="chip" type="button" data-duration="30">30m</button></div></article><div class="list-head"><h2 data-i18n="today.openLoops"></h2><button id="clearDoneBtn" class="ghost-btn" type="button" data-i18n="today.clearDone"></button></div><div class="task-scroll"><div id="taskGrid" class="task-grid" aria-live="polite"></div></div></div></section>
<section id="screen-time" class="screen" data-screen="time"><div class="timer-only"><div id="timeOrbit" class="time-orbit" data-i18n-aria="aria.visualTimer"><div class="timer-inner"><div class="timer-label" data-i18n="time.visibleTime"></div><div id="timerDigits" class="timer-digits">15:00</div><div id="timerPhase" class="timer-phase"></div></div></div><div class="timer-controls"><div class="duration-row"><button class="chip" data-timer-minutes="5" type="button">5</button><button class="chip active" data-timer-minutes="15" type="button">15</button><button class="chip" data-timer-minutes="25" type="button">25</button><button class="chip" data-timer-minutes="45" type="button">45</button></div><div class="timer-main-actions"><button id="timerToggleBtn" class="primary-btn" type="button"></button><button id="timerResetBtn" class="ghost-btn" type="button" data-i18n="common.reset"></button></div></div></div></section>
<section id="screen-menu" class="screen" data-screen="menu"><div class="menu-shell"><div class="segment-switch" role="tablist"><button class="segment-btn active" type="button" data-menu-view="dice" data-i18n="menu.taskDice"></button><button class="segment-btn" type="button" data-menu-view="dopamine" data-i18n="menu.dopamineTitle"></button></div><div id="menuPaneDice" class="menu-pane active"><article class="card roulette-card"><div class="roulette-stage" id="rouletteStage"><div class="dice-core"><div class="dice-icon">⌁</div><h2 id="diceResult" class="dice-result"></h2><p id="diceReason" class="dice-reason"></p></div></div><div class="roulette-actions"><button id="rollBtn" class="primary-btn" type="button" data-i18n="menu.roll"></button><button id="startRolledBtn" class="ghost-btn" type="button" disabled data-i18n="menu.startIt"></button></div></article></div><div id="menuPaneDopamine" class="menu-pane"><article class="card dopamine-card"><div id="dopamineItems" class="dopamine-items"></div></article></div></div></section>
<section id="screen-me" class="screen" data-screen="me"><div class="me-shell"><div class="stats-row"><div class="stat-card"><strong id="sessionCount">0</strong><span data-i18n="me.sessions"></span></div><div class="stat-card"><strong id="focusMinutes">0 min</strong><span data-i18n="me.focusTime"></span></div><div class="stat-card"><strong id="meSparkCount">0</strong><span data-i18n="common.sparks"></span></div></div><div class="settings-layout"><article class="card settings-card"><div class="eyebrow" data-i18n="me.preferences"></div><div class="settings-row"><div><strong data-i18n="me.language"></strong><span data-i18n="me.languageCopy"></span></div><div class="language-toggle" role="group" data-i18n-aria="aria.languageChoice"><button class="language-option" type="button" data-language="en">EN</button><button class="language-option" type="button" data-language="de">DE</button></div></div><div class="settings-row"><div><strong data-i18n="me.accent"></strong></div><div class="theme-options" data-i18n-aria="aria.chooseTheme"><button class="theme-dot" type="button" data-theme-value="midnight" data-i18n-aria="aria.mintTheme"></button><button class="theme-dot" type="button" data-theme-value="violet" data-i18n-aria="aria.violetTheme"></button><button class="theme-dot" type="button" data-theme-value="ember" data-i18n-aria="aria.emberTheme"></button></div></div><div class="settings-row"><div><strong data-i18n="me.dataHere"></strong></div><button id="exportBtn" class="ghost-btn" type="button" data-i18n="common.export"></button></div><div class="settings-row"><div><strong data-i18n="me.restore"></strong></div><button id="importBtn" class="ghost-btn" type="button" data-i18n="common.import"></button><input id="importFile" type="file" accept="application/json" hidden></div><div class="settings-row"><div><strong data-i18n="me.resetData"></strong></div><button id="resetDataBtn" class="danger-btn" type="button" data-i18n="common.reset"></button></div></article><article class="card settings-card"><div class="eyebrow" data-i18n="me.gentleRules"></div><div class="settings-row"><div><strong data-i18n="me.noStreaks"></strong></div><span data-i18n="me.alwaysOn"></span></div><div class="settings-row"><div><strong data-i18n="me.noShame"></strong></div><span data-i18n="me.alwaysOn"></span></div></article></div></div></section>
</main>
<nav class="bottom-nav" data-i18n-aria="aria.mainNavigation"><button class="nav-btn active" data-nav="today" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12h16M12 4v16"/></svg><span data-i18n="nav.today"></span></button><button class="nav-btn" data-nav="time" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/></svg><span data-i18n="nav.time"></span></button><button class="nav-btn" data-nav="menu" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 7h14M5 12h14M5 17h14"/></svg><span data-i18n="nav.menu"></span></button><button class="nav-btn" data-nav="me" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3"/><path d="M5.5 19c1.4-3.2 3.6-4.8 6.5-4.8s5.1 1.6 6.5 4.8"/></svg><span data-i18n="nav.me"></span></button></nav>
<div id="taskModalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="taskModalTitle"><div class="modal"><div class="modal-head"><div><div class="eyebrow" data-i18n="modal.eyebrow"></div><h2 id="taskModalTitle" data-i18n="modal.title"></h2></div><button id="closeTaskModalBtn" class="icon-btn" type="button" data-i18n-aria="aria.close">×</button></div><p data-i18n="modal.copy"></p><form id="taskForm"><div class="field"><label for="taskTitleInput" data-i18n="modal.taskLabel"></label><input id="taskTitleInput" maxlength="120" required></div><div class="field"><label for="taskMinutesInput" data-i18n="modal.durationLabel"></label><select id="taskMinutesInput"><option value="5">5 min</option><option value="15" selected>15 min</option><option value="30">30 min</option><option value="60">60 min</option><option value="90">90 min</option></select></div><div class="field"><label for="taskEnergyInput" data-i18n="modal.energyLabel"></label><select id="taskEnergyInput"><option value="low" data-i18n="energy.low"></option><option value="medium" selected data-i18n="energy.medium"></option><option value="high" data-i18n="energy.high"></option></select></div><div class="field"><label for="taskResistanceInput" data-i18n="modal.wallLabel"></label><select id="taskResistanceInput"><option value="1" data-i18n="resistance.low"></option><option value="2" selected data-i18n="resistance.medium"></option><option value="3" data-i18n="resistance.high"></option></select></div><div class="modal-actions"><button class="ghost-btn" id="cancelTaskModalBtn" type="button" data-i18n="common.cancel"></button><button class="primary-btn" type="submit" data-i18n="common.saveTask"></button></div></form></div></div>
<div id="emergencyBackdrop" class="emergency-backdrop" role="dialog" aria-modal="true" aria-labelledby="emergencyTitle"><div class="emergency-shell"><div class="emergency-top"><div class="emergency-brand" data-i18n="emergency.brand"></div><button id="closeEmergencyBtn" class="icon-btn" type="button" data-i18n-aria="aria.closeEmergency">×</button></div><div class="emergency-center"><div class="emergency-kicker" data-i18n="emergency.kicker"></div><h2 id="emergencyTitle" class="emergency-title"></h2><p id="emergencyCopy" class="emergency-copy"></p><div id="microSteps" class="micro-steps"></div></div><div class="emergency-bottom"><button id="emergencyDoneBtn" class="primary-btn" type="button" data-i18n="emergency.enough"></button><button id="emergencySwapBtn" class="ghost-btn" type="button" data-i18n="emergency.another"></button></div></div></div>
<script src="./app.js?v=1.5.0" defer></script></body></html>
